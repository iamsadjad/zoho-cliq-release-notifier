# Auto tag + GitHub Release on push to main (Conventional Commits).
# Also updates floating vMAJOR / vMAJOR.MINOR tags.

name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Semantic release
        id: semrel
        uses: go-semantic-release/action@2e9dc4247a6004f8377781bef4cb9dad273a741f # v1.24.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          changelog-file: CHANGELOG.md
          allow-initial-development-versions: true
          changelog-generator-opt: emojis=true

      - name: Update floating major and minor tags
        if: steps.semrel.outputs.version != ''
        env:
          VERSION: ${{ steps.semrel.outputs.version }}
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected version output: $VERSION"
            exit 1
          fi

          MAJOR="${VERSION%%.*}"
          MINOR_MAJOR="${VERSION%.*}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -f "v${MAJOR}"
          git tag -f "v${MINOR_MAJOR}"
          git push origin "refs/tags/v${MAJOR}" --force
          git push origin "refs/tags/v${MINOR_MAJOR}" --force
