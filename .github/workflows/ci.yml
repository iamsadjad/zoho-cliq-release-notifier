name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Format check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1 -race -coverprofile=coverage.out

      - name: Build binary
        run: CGO_ENABLED=0 go build -o /tmp/zoho-cliq-release-notifier ./cmd/zoho-cliq-release-notifier

      - name: Validate action.yml
        run: |
          python3 - <<'PY'
          import sys
          try:
              import yaml
          except ImportError:
              import subprocess
              subprocess.check_call([sys.executable, "-m", "pip", "install", "pyyaml", "-q"])
              import yaml
          with open("action.yml") as f:
              doc = yaml.safe_load(f)
          assert doc.get("name") == "Zoho Cliq Release Notifier"
          assert doc["runs"]["using"] == "docker"
          assert doc["runs"]["image"] == "Dockerfile"
          for key in ("webhook_url", "tag", "notify_prerelease", "github_token", "repository"):
              assert key in doc["inputs"], key
          print("action.yml validation passed")
          PY

      - name: Build Docker image
        run: docker build -t zoho-cliq-release-notifier:test .
